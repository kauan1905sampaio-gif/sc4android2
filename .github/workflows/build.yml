name: Build APK via EAS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: EAS Build (Android APK)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Setup Expo + EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build APK (preview)
        run: eas build --platform android --profile preview --non-interactive --no-wait

      - name: Print build URL
        run: |
          echo "✅ Build enviado para a nuvem do Expo!"
          echo "Acesse https://expo.dev/builds para baixar o APK quando terminar."
